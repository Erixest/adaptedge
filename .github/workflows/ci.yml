name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/erixest/adaptedge

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests and coverage
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml --cov=adaptedge --cov-report=xml:reports/coverage.xml --cov-report=term-missing
      - name: Reproducible evaluation
        run: python -m adaptedge.evaluate --runs 200 --seed 42 --out reports/metrics.json
      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: error

  container:
    name: container build, smoke test, publish
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name adaptedge-ci -p 127.0.0.1:18080:8000 "${{ env.IMAGE }}:${{ github.sha }}"
          for i in $(seq 1 30); do
            if python3 scripts/healthcheck.py 18080; then
              docker rm -f adaptedge-ci
              exit 0
            fi
            sleep 2
          done
          docker logs adaptedge-ci
          docker rm -f adaptedge-ci
          exit 1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"
